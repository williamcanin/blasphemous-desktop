<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ page.title | default: site.title }}</title>
<meta name="description" content="{{ site.description }}">

<!--
  "GitHub markdown" style for the whole site:
  - github-markdown-css: replicates the typography/colors/lists/tables of the
    Markdown rendered on GitHub itself (including automatic light/dark mode,
    via prefers-color-scheme).
  - github.css (rouge/pygments theme): syntax highlighting for code blocks,
    same as the one used by GitHub.
  - site.css: our own CSS, only the page "container" (width, spacing, background)
    — everything inside ".markdown-body" is handled by github-markdown-css.
-->

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/github-markdown-css@5/github-markdown-light.css">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/jwarby/jekyll-pygments-themes@master/github.css">

<link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">

<!-- Theme gallery specific CSS (lightbox), only affects /gallery/ -->
<link rel="stylesheet" href="{{ '/assets/css/gallery.css' | relative_url }}">
