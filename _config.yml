title: ""
description: "Blasphemous Desktop — Personal Wayland desktop configuration with Hyprland for Arch Linux and Fedora by William C. Canin"
url: "https://williamcanin.github.io"
baseurl: "/blasphemous-desktop"

layouts_dir: .docs/gh-pages/_layouts
includes_dir: .docs/gh-pages/_includes

# The documentation pages live in ".docs/gh-pages/_pages" (a collection),
# not in "_pages" at the repository root.
#
# IMPORTANT: "_pages" is a folder with "_" inside ".docs" (with "."), so
# Jekyll, by default, IGNORES its content when scanning the site normally
# (folders/files starting with "." or "_" are skipped). Trying to solve this
# only with "include:" does not work reliably for nested folders (e.g.
# ".docs/gh-pages/_pages") — Jekyll's matching only compares the file/folder
# name directly against "source/", ignoring the subdirectories in between.
#
# The correct and officially supported way is to declare a "collection":
# Jekyll reads the "_pages" directory directly from "collections_dir",
# bypassing the "." / "_" exclusion filter. That is what fixes the 404s in
# the documentation links.
collections_dir: .docs/gh-pages
collections:
  pages:
    output: true

# Assets (CSS, JS, images) are copied manually in the workflow
# (actions/jekyll-build-pages does not reliably copy directories with ".").
# See .github/workflows/pages.yml → "Copy static assets".
